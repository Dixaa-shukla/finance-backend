services:
  ollama:
    build:
      context: ./docker/ollama
      args:
        OLLAMA_MODEL: llama3.2:1b   # ⚠️ small model (~1.3GB) -- deliberate choice for 8GB machines, see notes below
    container_name: finance-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    # ⚠️ Hard memory cap -- prevents Ollama from ever ballooning and
    # starving IntelliJ/MySQL/Spring Boot of RAM on an 8GB machine.
    # If you hit OOM errors inside the container with this cap, that's
    # a signal to use an even smaller model, not to raise this number.
    mem_limit: 2g

  tesseract:
    image: tesseractshadow/tesseract4re:latest
    container_name: finance-tesseract
    volumes:
      - ./ocr/tessdata:/usr/share/tesseract-ocr/4.00/tessdata
    restart: "no"

volumes:
  ollama-data:

# ⚠️ RUN THIS ON-DEMAND, NOT CONTINUOUSLY, on an 8GB machine:
#   Start only when testing the fallback path:  docker compose up -d ollama
#   Stop it the rest of the time:                docker compose stop ollama
# Leaving it running 24/7 alongside IntelliJ + MySQL is what causes
# slowdowns/crashes on 8GB RAM -- it doesn't need to be "always on"
# since Gemini is the primary provider for normal day-to-day use.