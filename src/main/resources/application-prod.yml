spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
    show-sql: false
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: auth-backend
      access-ttl-seconds: 900
      refresh-ttl-seconds: 1209600
      refresh-cookie-name: refresh_token
      cookie-secure: true
      cookie-same-site: None

    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - email
              - profile

  mail:
    host: sandbox.smtp.mailtrap.io
    port: 2525
    username: ${MAILTRAP_USERNAME}
    password: ${MAILTRAP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-3.6-flash
            temperature: 0.4
        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            options:
              model: gemini-embedding-001

    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: llama3.2:1b
          temperature: 0.4
      embedding:
        options:
          model: nomic-embed-text

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

finance:
  ai:
    primary-provider: gemini
    vector-store:
      persist-path: ./data/vector-store.json

  ocr:
    tessdata-path: ./ocr/tessdata

  auth:
    enforce: true
    admin-emails: ${ADMIN_EMAILS}
    frontend-redirect-uri: ${FRONTEND_URL}/oauth2/callback
    password-reset-minutes: 60

    email:
      from: no-reply@finance-backend.local
      password-reset-base-url: ${FRONTEND_URL}/reset-password

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}